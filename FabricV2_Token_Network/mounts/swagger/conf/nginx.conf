server {
    listen 8090;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Served out of directory mounts rather than being copied over the image's
    # html/ tree. A single-file bind mount pins an inode, so the first edit that
    # REPLACES the file - which is what editors and `sed -i` do - leaves the
    # container unable to start at all. Mounting the parent directory instead
    # means an edit is picked up on the next request.
    location = /openapi.yaml {
        alias /srv/api/openapi.yaml;
    }

    location = /swagger-initializer.js {
        alias /srv/ui/swagger-initializer.js;
    }

    # Docker's embedded DNS, needed together with the variable upstreams below.
    # Without both, nginx resolves the node hostnames once at startup and EXITS
    # with "host not found in upstream" if a node is not up yet; with them it
    # resolves per request and merely 502s until the node appears. That is what
    # lets this service carry no depends_on and survive a node restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # proxy_pass with a variable does not strip the location prefix, so each
    # block rewrites explicitly. rewrite carries the query string over, which
    # the auditor's mandatory ?tokenType depends on.
    location /api/issuer/ {
        set $issuer_upstream http://issuer.example.com:9100;
        rewrite ^/api/issuer/(.*)$ /$1 break;
        proxy_pass $issuer_upstream;
    }

    location /api/auditor/ {
        set $auditor_upstream http://auditor.example.com:9000;
        rewrite ^/api/auditor/(.*)$ /$1 break;
        proxy_pass $auditor_upstream;
    }

    location /api/owner/ {
        set $owner_upstream http://owner.example.com:9200;
        rewrite ^/api/owner/(.*)$ /$1 break;
        proxy_pass $owner_upstream;
    }
}
